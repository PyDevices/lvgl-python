[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pydevices-lvgl"
dynamic = ["version"]
description = "LVGL bindings for CPython (generated); import as lvgl"
readme = "README.md"
requires-python = ">=3.10"
urls = { Homepage = "https://github.com/PyDevices/lvgl-python", Documentation = "https://github.com/PyDevices/lvgl-python#readme", Issues = "https://github.com/PyDevices/lvgl-python/issues" }

[tool.setuptools.dynamic]
version = {file = "VERSION"}

[tool.setuptools]
packages = []
py-modules = ["display_driver", "fs_driver"]

# Wheel CI: one wheel per CPython minor (cp310…cp314) × Linux + Windows + Android — see README.
# Local reproduction: docs/publishing.md § "Local wheel builds (cibuildwheel)" (Linux needs Docker).
[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp313-* cp314-*"
skip = "*musllinux* *-macosx_* *-win32"
test-command = "python -c \"import lvgl as lv; lv.init(); lv.deinit()\""
# cp314: import test passes then segfaults on interpreter shutdown after lv.deinit()
test-skip = "cp314-*"

[tool.cibuildwheel.linux]
archs = ["x86_64"]
manylinux-x86_64-image = "manylinux_2_28"

[tool.cibuildwheel.windows]
archs = ["AMD64"]

# PEP 738 Android tags: android_<api>_<arch> (e.g. android_21_arm64_v8a).
# cibuildwheel 4.x builds Android wheels for CPython 3.13–3.14 only (matches p4a).
# p4a / buildozer install these via --extra-index-url when a matching prebuilt wheel exists.
#
# cibuildwheel 4.x Android archs are only arm64_v8a and x86_64 (no armeabi_v7a).
# Phones/TVs: arm64_v8a. Emulators: x86_64. API 21 tags remain installable when
# the app minSdk is higher (e.g. p4a android.minapi = 24).
[tool.cibuildwheel.android]
archs = ["arm64_v8a", "x86_64"]
environment = { ANDROID_API_LEVEL = "21" }
test-command = "python -c \"import lvgl as lv; lv.init(); lv.deinit()\""
# Emulator tests are optional in CI; wheels are smoke-tested on device via pydevices-examples APK.
test-skip = "*"

[[tool.cibuildwheel.overrides]]
select = "*-android_*"
build-frontend = "build"
