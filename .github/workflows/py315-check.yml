# Temporary: builds and tests the cp315 and cp315t wheels on Linux for this PR.
# Removed before merge.
name: py315 wheel check
on: pull_request
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp315-manylinux_x86_64 cp315t-manylinux_x86_64"
          CIBW_TEST_SKIP: ""
