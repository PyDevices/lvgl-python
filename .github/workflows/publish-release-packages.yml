name: Publish release packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      release-ref:
        description: Exact vX.Y.Z tag to retry
        required: true
        type: string

# publishing-v5 ceiling: contents:write (release assets), id-token:write
# (PyPI Trusted Publishing).
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    uses: PyDevices/.github/.github/workflows/reusable-publish-release-packages.yml@publishing-v5
    with:
      build-kind: native-and-wasm
      distribution-name: pydevices-lvgl
      wheel-filename-prefix: pydevices_lvgl
      checkout-submodules: true
      release-ref: ${{ inputs.release-ref }}
    secrets: inherit
