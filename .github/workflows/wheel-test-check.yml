# Temporary: runs the release's cibuildwheel test on a regular and the 3.15
# builds, Linux and Windows, for this PR. Removed before merge.
name: wheel test check
on: pull_request
jobs:
  wheels:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: pypa/cibuildwheel@v4.2.1
        env:
          CIBW_BUILD: "cp313-* cp315-* cp315t-*"
          CIBW_SKIP: "*musllinux* *-win32"
